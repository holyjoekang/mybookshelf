name: 서재 자동 업데이트
# 매주 월요일 아침(한국 시각 7시)과 수동 실행: 블로그 새 글 → 책 → 카카오 표지 → 앱 파일, 바뀐 것이 있으면 main에 커밋
on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/update_site.py --covers
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data app
          git diff --cached --quiet || (git commit -m "서재 자동 업데이트" && git push)
